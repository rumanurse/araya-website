<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#0f2347"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Gold accent line top -->
  <rect x="10" y="6" width="44" height="3" rx="1.5" fill="url(#gold)" opacity="0.6"/>
  <!-- Letter A -->
  <text x="32" y="46"
    font-family="Georgia, serif"
    font-size="38"
    font-weight="700"
    font-style="italic"
    fill="url(#gold)"
    text-anchor="middle"
    dominant-baseline="auto">A</text>
</svg>
